name: Windows WebSocket logging proof

on:
  workflow_dispatch:
  push:
    branches:
      - fix/666-windows-proof

permissions:
  contents: read

concurrency:
  group: websocket-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-proof:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_RELEASE_STRIP: false
      CMAKE_GENERATOR: Ninja
      AWS_LC_SYS_PREBUILT_NASM: 1
      VITE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: pnpm
      - name: Verify pnpm execution and install dependencies
        run: |
          $shimVersion = pnpm --version
          Write-Host "PowerShell shim version output: '$shimVersion'"
          $pnpmVersion = pnpm.cmd --version
          if ($LASTEXITCODE -ne 0 -or "$pnpmVersion".Trim() -ne '12.3.4') {
            throw "pnpm.cmd did not execute the required version"
          }
          pnpm.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path node_modules/.modules.yaml)) {
            throw "pnpm install did not create the workspace dependency metadata"
          }
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061
        with:
          perl-version: '5.32'
          distribution: strawberry
      - name: Install native build dependencies
        run: choco install nasm ninja -y
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: websocket-windows-proof
          cache-on-failure: true
      - name: Test actual transport and handshake logs
        run: |
          cargo test --locked -p kftray-http-logs --lib http_response_analyzer::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p kftray-portforward --lib kube::tcp_forwarder::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned desktop testing binary
        run: |
          pnpm.cmd tauri build --no-bundle --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($binary in @('kftray.exe', 'kftray-helper.exe')) {
            if (-not (Test-Path "target/release/$binary")) {
              throw "Desktop build did not produce $binary"
            }
          }
      - name: Assemble proof archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path proof
          Copy-Item target/release/kftray.exe proof/kftray.exe
          Copy-Item target/release/kftray-helper.exe proof/kftray-helper.exe
          $sourceCommit = git rev-parse --verify 'HEAD^'
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -ne '1909d30ec3f61dac17a2ece0569a82f94f4965e6') {
            throw "Unexpected source provenance"
          }
          $buildCommit = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0 -or $buildCommit -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid build provenance"
          }
          @"
          KFtray Windows x64 development proof (unsigned, not a release).
          Source commit: $sourceCommit
          Build-workflow commit: $buildCommit
          Unzip both executable files together and run kftray.exe.
          Requires the Microsoft Edge WebView2 runtime.
          Compare the same forwarding configuration with HTTP logging enabled and disabled.
          Expected with logging enabled: the 101 handshake is logged once, later frames are not logged as HTTP, and bidirectional WebSocket traffic is preserved.
          The original OpenClaw gateway failure has not been reproduced; this build does not establish that issue 666 is fixed.
          "@ | Set-Content proof/BUILD.txt
          Get-FileHash proof/*.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 200 | Set-Content proof/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kftray-windows-x64-websocket-proof
          path: proof/
          if-no-files-found: error
          retention-days: 14
